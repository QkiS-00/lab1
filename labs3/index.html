<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Lab3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toolbar" role="toolbar" aria-label="Типи об’єктів">
    <button data-shape="point" data-tooltip="Крапка" aria-label="Крапка" aria-pressed="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5" fill="#000"/></svg>
    </button>
    <button data-shape="line" data-tooltip="Лінія" aria-label="Лінія" aria-pressed="false">
      <svg viewBox="0 0 24 24"><line x1="4" y1="20" x2="20" y2="4" stroke="#000" stroke-width="2"/></svg>
    </button>
    <button data-shape="rect" data-tooltip="Прямокутник" aria-label="Прямокутник" aria-pressed="false">
      <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" fill="none" stroke="#000" stroke-width="2"/></svg>
    </button>
    <button data-shape="ellipse" data-tooltip="Еліпс" aria-label="Еліпс" aria-pressed="false">
      <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="6" fill="#808080" stroke="#000" stroke-width="2"/></svg>
    </button>
  </div>
  <canvas id="canvas"></canvas>
  <script type="module" src="page.js"></script>
</body>
</html>
